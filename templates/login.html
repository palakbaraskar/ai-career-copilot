{% extends "base.html" %}

{% block title %}Log In | AI Career Co-Pilot{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-icon-box">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to access your personalized dashboard, saved ATS scores, and interview history.</p>
        </div>

        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password *</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-check-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="1"> Remember me on this device
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="/register">Create one here</a></p>
        </div>
    </div>
</div>
{% endblock %}
