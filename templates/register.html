{% extends "base.html" %}

{% block title %}Create Account | AI Career Co-Pilot{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-icon-box">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create Your Account</h2>
            <p>Register to save your resume audits, job matches, and track interview performance over time.</p>
        </div>

        <form method="POST" action="/register" class="auth-form">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" value="{{ name or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password * (Min. 6 chars)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-shield-check"></i> Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Sign in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
